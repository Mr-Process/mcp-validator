name: 'MCP Validator Action'
description: 'Automated validation for MCP servers: tool schema validation, fuzzing, resources, and prompts.'
author: 'Mr-Process'
inputs:
  server-url:
    description: 'HTTP/Streamable MCP server URL'
    required: false
  command:
    description: 'Local command to run stdio MCP server'
    required: false
  format:
    description: 'Output format (json or md)'
    required: false
    default: 'md'
  timeout:
    description: 'Request timeout in milliseconds'
    required: false
    default: '30000'
outputs:
  report:
    description: 'The complete validation report string'
  passed:
    description: 'Number of passed tests'
  failed:
    description: 'Number of failed tests'
runs:
  using: 'node20'
  main: 'dist/cli.js'
